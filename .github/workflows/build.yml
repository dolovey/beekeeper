name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Устанавливаем Python 3.11 (стабильная версия для сборки)
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 2. Устанавливаем Java 17
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Устанавливаем Android SDK и сразу принимаем лицензии
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 4. Устанавливаем системные библиотеки Linux (нужны для сборки Flutter)
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      # 5. Устанавливаем Flet через pip (без uv)
      - name: Install Flet
        run: pip install flet==1.0.5

      # 6. Запускаем сборку с указанием Python 3.12 для встроенного интерпретатора
      - name: Build APK
        run: |
          echo "y" | flet build apk --python-version 3.12 --verbose

      # 7. Загружаем готовый APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beekeeper-apk
          path: '**/*.apk'
