name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Официальное действие Flet для сборки (самый надёжный способ)
      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"

      # 2. Загрузка готового файла
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beekeeper-apk
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
