name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # 1. Настраиваем Java (нужна для Android SDK)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      # 2. Устанавливаем Android SDK и сразу принимаем все лицензии
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          
      # 3. Устанавливаем Flet
      - name: Install Flet
        run: pip install flet==1.0.5
        
      # 4. Собираем APK
      - name: Build APK
        run: echo "y" | flet build apk
        
      # 5. Загружаем готовый файл
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beekeeper-apk
          path: '**/*.apk'
